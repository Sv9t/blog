# CI/CD: сборка Astro на GitHub Actions → публикация через GitHub Pages.
#
# Почему так:
#   • Хостинг и TLS — бесплатно от GitHub, без внешних серверов/секретов.
#   • Деплой идёт прямо из репозитория: push в main → сборка → публикация.
#   • Кастомный домен sv9t.ru привязывается файлом public/CNAME.
#
# Требует одноразовой настройки (см. README → «Деплой»):
#   Settings → Pages → Source: «GitHub Actions»
#   Settings → Pages → Custom domain: sv9t.ru (+ Enforce HTTPS)

name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Деплои идут последовательно — параллельные запуски могут перетереть артефакт
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        # astro check (типы/diagnostics) + astro build → ./dist
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
